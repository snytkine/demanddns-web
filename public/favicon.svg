<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 0.5 45 45">
  <defs>
    <!-- Same top-to-bottom blues as the primary (Download) button. -->
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="44">
      <stop offset="0" stop-color="#4a93ff"/>
      <stop offset="1" stop-color="#1560e0"/>
    </linearGradient>
    <!-- Cuts a gap out of the first D where the second D passes over it. -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <rect width="48" height="48" fill="#fff"/>
      <path d="M20 20.2h5a9 9 0 0 1 0 18h-5z" fill="none" stroke="#000" stroke-width="4.6" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g fill="none" stroke="url(#blue)" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="2" d="M24,43.5c9.0432-3.1174,15.4885-10.3631,16.5-19.5889a79.36,79.36,0,0,0-.0714-12.0267,2.5414,2.5414,0,0,0-2.4677-2.3663c-4.0911-.126-8.8455-.8077-12.52-4.4273a2.0516,2.0516,0,0,0-2.881,0C18.885,8.71,14.1306,9.3921,10.04,9.5181a2.5414,2.5414,0,0,0-2.4677,2.3663A79.36,79.36,0,0,0,7.5,23.9111C8.5115,33.1369,14.9568,40.3826,24,43.5Z"/>
    <!-- Each D is 14 wide and 18 high. The second is offset 50% right (7) and 40% down (7.2). -->
    <path class="letter" stroke-width="2.4" mask="url(#cut)" d="M13 13h5a9 9 0 0 1 0 18h-5z"/>
    <path class="letter" stroke-width="2.4" d="M20 20.2h5a9 9 0 0 1 0 18h-5z"/>
  </g>
</svg>
