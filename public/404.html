<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Command DNS</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 0 16px;
        text-align: center;
      }
    </style>
    <script>
      // GitHub Pages serves this file for every address that has no file behind it, such as
      // /demanddns-web/features. The app uses hash routing, so the same page lives at
      // /demanddns-web/#/features. Rewrite the address and let the app take over.
      // Unknown pages end up on the app's own "Page not found" screen.
      (function () {
        // A project site is served under /<repository>/, a custom domain from the root.
        var keep = location.hostname.slice(-10) === '.github.io' ? 1 : 0;
        var segments = location.pathname.split('/');
        var base = segments.slice(0, 1 + keep).join('/');
        var route = segments.slice(1 + keep).join('/');
        location.replace(base + '/#/' + route + location.search);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p>This site needs JavaScript to run.</p>
    </noscript>
  </body>
</html>
